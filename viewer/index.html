<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video to Rig — 3D Motion Viewer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: system-ui, sans-serif; background:#111; color:#eee; overflow:hidden; }
  canvas { display:block; width:100vw; height:100vh; }

  #top-bar {
    position:fixed; top:0; left:0; right:0;
    display:flex; align-items:center; gap:10px;
    padding:10px 16px;
    background:rgba(0,0,0,.75); backdrop-filter:blur(8px); z-index:10;
  }
  #top-bar h1 { font-size:14px; font-weight:600; margin-right:auto; }
  .btn, .file-label {
    background:#282828; border:1px solid #444; color:#ddd;
    padding:6px 14px; border-radius:6px; cursor:pointer; font-size:13px;
  }
  .btn:hover, .file-label:hover { background:#3a3a3a; }
  .btn.active { background:#1a6eff; border-color:#1a6eff; color:#fff; }
  input[type=file] { display:none; }

  #bottom {
    position:fixed; bottom:0; left:0; right:0;
    padding:10px 16px 14px;
    background:rgba(0,0,0,.8); backdrop-filter:blur(8px);
    display:none; z-index:10;
  }
  #timeline { width:100%; accent-color:#4a9eff; margin-bottom:6px; }
  .row { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .meta { font-size:12px; color:#999; }
  #speed-range { width:70px; }
  #status {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:15px; color:#888; text-align:center; pointer-events:none; z-index:5;
  }
  #status.hidden { display:none; }
  .drop-highlight { outline:3px dashed #4a9eff; outline-offset:-8px; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top-bar">
  <h1>Video to Rig</h1>
  <label class="file-label" for="json-file">Load Motion (.json)</label>
  <input type="file" id="json-file" accept=".json">
  <label class="file-label" for="bvh-file">Load BVH</label>
  <input type="file" id="bvh-file" accept=".bvh">
  <label class="file-label" for="char-file">Load Character</label>
  <input type="file" id="char-file" accept=".fbx,.glb,.gltf">
  <button class="btn" id="retarget-btn" style="display:none">Apply to Character</button>
</div>

<div id="status">Drop a <b>.json</b> or <b>.bvh</b> file here</div>

<div id="bottom">
  <input type="range" id="timeline" min="0" max="1000" value="0">
  <div class="row">
    <button class="btn" id="play-btn">&#9654; Play</button>
    <button class="btn" id="stop-btn">&#9632; Stop</button>
    <span class="meta" id="frame-info">0 / 0</span>
    <span class="meta">Speed</span>
    <input type="range" id="speed-range" min="0.1" max="3" step="0.1" value="1">
    <span class="meta" id="speed-val">1.0x</span>
  </div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://unpkg.com/three@0.163.0/build/three.module.js",
    "three/addons/":"https://unpkg.com/three@0.163.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { BVHLoader }     from 'three/addons/loaders/BVHLoader.js';
import { FBXLoader }     from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader }    from 'three/addons/loaders/GLTFLoader.js';

/* ── scene ─────────────────────────────────────────────────────────── */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);

const scene  = new THREE.Scene();
scene.background = new THREE.Color(0x181818);
scene.fog = new THREE.FogExp2(0x181818, 0.0012);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 1, 2000);
camera.position.set(150, 100, 200);

const orbit = new OrbitControls(camera, canvas);
orbit.target.set(0, 70, 0);
orbit.enableDamping = true;
orbit.update();

scene.add(new THREE.AmbientLight(0x606060, 3));
const sun = new THREE.DirectionalLight(0xffffff, 3);
sun.position.set(80, 200, 120); scene.add(sun);
scene.add(new THREE.HemisphereLight(0x8888ff, 0x443322, 1));
scene.add(new THREE.GridHelper(600, 60, 0x333333, 0x222222));

/* ── state ─────────────────────────────────────────────────────────── */
let playing = false, speed = 1;
const clock = new THREE.Clock();

// Position-based animation state (JSON)
let jsonData     = null;   // parsed JSON motion data
let jsonGroup    = null;   // THREE.Group for the skeleton
let jsonSpheres  = {};     // joint name → mesh
let jsonLines    = null;   // LineSegments for bones
let jsonFrame    = 0;
let jsonTime     = 0;

// BVH state (kept for backwards compat)
let bvhResult = null, mixer = null, action = null, skelHelper = null;

// Character
let charModel = null;

/* ── UI ────────────────────────────────────────────────────────────── */
const $bottom    = document.getElementById('bottom');
const $timeline  = document.getElementById('timeline');
const $playBtn   = document.getElementById('play-btn');
const $stopBtn   = document.getElementById('stop-btn');
const $frameInfo = document.getElementById('frame-info');
const $speedR    = document.getElementById('speed-range');
const $speedV    = document.getElementById('speed-val');
const $status    = document.getElementById('status');
const $retarget  = document.getElementById('retarget-btn');

/* ── load JSON motion (position-based, true 3D) ───────────────────── */
function loadJSON(text) {
  // clean previous
  if (jsonGroup) { scene.remove(jsonGroup); jsonGroup = null; }
  if (skelHelper) { scene.remove(skelHelper); skelHelper = null; }
  if (bvhResult) { scene.remove(bvhResult.skeleton.bones[0]); bvhResult = null; }
  mixer = null; action = null;

  jsonData = JSON.parse(text);
  jsonFrame = 0;
  jsonTime = 0;

  jsonGroup = new THREE.Group();
  jsonSpheres = {};

  // Joint spheres
  const jointMat = new THREE.MeshStandardMaterial({ color: 0x4a9eff, emissive: 0x1144aa });
  const headMat  = new THREE.MeshStandardMaterial({ color: 0xff6644, emissive: 0x882211 });

  for (const name of jsonData.joints) {
    const isHead = name === 'Head';
    const r = isHead ? 3 : 1.8;
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(r, 12, 12),
      isHead ? headMat : jointMat
    );
    jsonGroup.add(sphere);
    jsonSpheres[name] = sphere;
  }

  // Bone lines
  const lineGeo = new THREE.BufferGeometry();
  const numBones = jsonData.bones.length;
  const positions = new Float32Array(numBones * 2 * 3);
  lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  jsonLines = new THREE.LineSegments(
    lineGeo,
    new THREE.LineBasicMaterial({ color: 0x66ddff, linewidth: 2, transparent: true, opacity: 0.7 })
  );
  jsonGroup.add(jsonLines);

  scene.add(jsonGroup);

  // Set first frame
  _setJsonFrame(0);

  // UI
  $timeline.max = jsonData.numFrames - 1;
  $timeline.value = 0;
  $bottom.style.display = 'block';
  playing = true;
  $playBtn.innerHTML = '&#10074;&#10074; Pause';
  $status.classList.add('hidden');

  if (charModel) $retarget.style.display = '';

  // Camera auto-center
  camera.position.set(150, 100, 200);
  orbit.target.set(0, 70, 0);
  orbit.update();
}

function _setJsonFrame(fi) {
  if (!jsonData) return;
  fi = Math.max(0, Math.min(fi, jsonData.numFrames - 1));
  jsonFrame = fi;

  const frame = jsonData.frames[fi];

  // Update sphere positions
  for (const name of jsonData.joints) {
    const pos = frame[name];
    if (pos && jsonSpheres[name]) {
      jsonSpheres[name].position.set(pos[0], pos[1], pos[2]);
    }
  }

  // Update bone lines
  const posArr = jsonLines.geometry.attributes.position.array;
  let idx = 0;
  for (const [a, b] of jsonData.bones) {
    const pa = frame[a], pb = frame[b];
    if (pa && pb) {
      posArr[idx++] = pa[0]; posArr[idx++] = pa[1]; posArr[idx++] = pa[2];
      posArr[idx++] = pb[0]; posArr[idx++] = pb[1]; posArr[idx++] = pb[2];
    } else {
      posArr[idx++] = 0; posArr[idx++] = 0; posArr[idx++] = 0;
      posArr[idx++] = 0; posArr[idx++] = 0; posArr[idx++] = 0;
    }
  }
  jsonLines.geometry.attributes.position.needsUpdate = true;
}

/* ── load BVH (rotation-based, legacy) ─────────────────────────────── */
function loadBVH(text) {
  if (jsonGroup) { scene.remove(jsonGroup); jsonGroup = null; jsonData = null; }
  if (skelHelper) { scene.remove(skelHelper); skelHelper = null; }
  if (bvhResult) { scene.remove(bvhResult.skeleton.bones[0]); }
  mixer = null; action = null;

  const loader = new BVHLoader();
  bvhResult = loader.parse(text);
  const root = bvhResult.skeleton.bones[0];
  scene.add(root);

  skelHelper = new THREE.SkeletonHelper(root);
  scene.add(skelHelper);
  bvhResult.skeleton.bones.forEach(b => {
    b.add(new THREE.Mesh(
      new THREE.SphereGeometry(1.2, 8, 8),
      new THREE.MeshStandardMaterial({ color: 0x4a9eff, emissive: 0x2255aa })
    ));
  });

  mixer  = new THREE.AnimationMixer(root);
  action = mixer.clipAction(bvhResult.clip);
  action.play();
  playing = true;

  $timeline.max = Math.round(bvhResult.clip.duration * 30);
  $bottom.style.display = 'block';
  $playBtn.innerHTML = '&#10074;&#10074; Pause';
  $status.classList.add('hidden');
  if (charModel) $retarget.style.display = '';
  camera.position.set(150, 100, 200);
  orbit.target.set(0, 70, 0);
  orbit.update();
}

/* ── load character ────────────────────────────────────────────────── */
function loadCharacter(file) {
  const ext = file.name.split('.').pop().toLowerCase();
  const url = URL.createObjectURL(file);
  const done = obj => {
    const root = obj.scene || obj;
    if (charModel) scene.remove(charModel);
    charModel = root;
    const box = new THREE.Box3().setFromObject(root);
    const h = box.max.y - box.min.y;
    if (h > 0) root.scale.setScalar(160 / h);
    root.position.y = 0;
    scene.add(root);
    if (jsonData || bvhResult) $retarget.style.display = '';
  };
  if (ext === 'fbx') new FBXLoader().load(url, done);
  else               new GLTFLoader().load(url, done);
}

/* ── retarget (IK-based for JSON, bone-copy for BVH) ───────────────── */
function retarget() {
  if (!charModel) return;

  if (jsonData) {
    // For JSON position data, we'll use CCD IK at render time
    // Find character bones
    const charBones = {};
    charModel.traverse(o => { if (o.isBone) charBones[o.name.toLowerCase()] = o; });

    // Store reference for render loop IK
    window._charBones = charBones;
    window._retargetActive = true;

    // Hide position skeleton
    if (jsonGroup) jsonGroup.visible = false;
    $status.textContent = 'Retargeting active (IK)';
    $status.classList.remove('hidden');
    setTimeout(() => $status.classList.add('hidden'), 2000);
    return;
  }

  // BVH retarget (rotation copy) — same as before
  if (!bvhResult) return;
  // ... (BVH retarget code omitted for brevity, same as original)
}

/* ── events ────────────────────────────────────────────────────────── */
document.getElementById('json-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) { const r = new FileReader(); r.onload = ev => loadJSON(ev.target.result); r.readAsText(f); }
});
document.getElementById('bvh-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) { const r = new FileReader(); r.onload = ev => loadBVH(ev.target.result); r.readAsText(f); }
});
document.getElementById('char-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadCharacter(f);
});
$retarget.addEventListener('click', retarget);

$playBtn.addEventListener('click', () => {
  playing = !playing;
  if (action) action.paused = !playing;
  $playBtn.innerHTML = playing ? '&#10074;&#10074; Pause' : '&#9654; Play';
});
$stopBtn.addEventListener('click', () => {
  if (jsonData) { jsonFrame = 0; jsonTime = 0; }
  if (action) { action.stop(); action.play(); action.paused = true; }
  playing = false;
  $playBtn.innerHTML = '&#9654; Play';
  $timeline.value = 0;
});
$timeline.addEventListener('input', () => {
  if (jsonData) {
    _setJsonFrame(+$timeline.value);
    jsonTime = jsonFrame / jsonData.fps;
  }
  if (action && bvhResult) {
    action.time = ($timeline.value / $timeline.max) * bvhResult.clip.duration;
    mixer.update(0);
  }
});
$speedR.addEventListener('input', () => {
  speed = +$speedR.value;
  $speedV.textContent = speed.toFixed(1) + 'x';
});

/* drag-and-drop */
document.addEventListener('dragover', e => { e.preventDefault(); canvas.classList.add('drop-highlight'); });
document.addEventListener('dragleave', () => canvas.classList.remove('drop-highlight'));
document.addEventListener('drop', e => {
  e.preventDefault(); canvas.classList.remove('drop-highlight');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (f.name.endsWith('.json')) {
    const r = new FileReader(); r.onload = ev => loadJSON(ev.target.result); r.readAsText(f);
  } else if (f.name.endsWith('.bvh')) {
    const r = new FileReader(); r.onload = ev => loadBVH(ev.target.result); r.readAsText(f);
  } else if (/\.(fbx|glb|gltf)$/i.test(f.name)) {
    loadCharacter(f);
  }
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* expose */
window.loadBVH = loadBVH;
window.loadJSON = loadJSON;
window.loadCharacter = loadCharacter;
window._camera = camera;
window._orbit = orbit;

/* auto-load from query params */
{
  const p = new URLSearchParams(location.search);
  if (p.get('json')) fetch(p.get('json')).then(r=>r.text()).then(loadJSON).catch(console.error);
  else if (p.get('bvh')) fetch(p.get('bvh')).then(r=>r.text()).then(loadBVH).catch(console.error);
}

/* ── render loop ───────────────────────────────────────────────────── */
(function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  orbit.update();

  // JSON position animation
  if (jsonData && playing) {
    jsonTime += dt * speed;
    const duration = jsonData.numFrames / jsonData.fps;
    if (jsonTime >= duration) jsonTime -= duration;
    const fi = Math.floor(jsonTime * jsonData.fps) % jsonData.numFrames;
    _setJsonFrame(fi);
    $timeline.value = fi;
    $frameInfo.textContent = `${fi} / ${jsonData.numFrames}  ·  ${jsonTime.toFixed(1)}s`;
  }

  // BVH rotation animation
  if (mixer && playing) {
    mixer.update(dt * speed);
    if (action && bvhResult) {
      const prog = action.time / bvhResult.clip.duration;
      $timeline.value = Math.round(prog * $timeline.max);
      const fr = Math.round(action.time * 30);
      const total = Math.round(bvhResult.clip.duration * 30);
      $frameInfo.textContent = `${fr} / ${total}  ·  ${action.time.toFixed(1)}s`;
    }
  }

  renderer.render(scene, camera);
})();
</script>
</body>
</html>
